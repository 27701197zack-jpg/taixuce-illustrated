<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="q7S6mWIn8DFXDOhRU6O6dU">
<head data-page-node-id="TdHETxoaUkixobnVO0nw47">
<meta charset="utf-8" data-page-node-id="q3so9ZiCbxUGgxSdkdfxQ6">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" data-page-node-id="yoEd7oOoT3fMj1kL4gUOHu">
<title>太虚册 · 一场心的历险</title>
<style>
:root{
  --paper:#f4efe4;      /* 宣纸 */
  --paper2:#efe8da;
  --ink:#2b2622;        /* 浓墨 */
  --ink2:#5d554c;       /* 中墨 */
  --ink3:#8d8477;       /* 淡墨 */
  --zhu:#9c3a2e;        /* 朱砂 */
  --qing:#46707a;       /* 石青 */
  --zhe:#a07f42;        /* 赭石 */
  --line:#cfc4ad;
  --line2:#e2d9c6;
  --gold:#b08d47;
  --serif:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","楷体",var(--serif);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(160,127,66,.055), transparent 42%),
    radial-gradient(circle at 88% 32%, rgba(70,112,122,.05), transparent 46%),
    radial-gradient(circle at 45% 88%, rgba(156,58,46,.035), transparent 40%),
    repeating-linear-gradient(96deg, rgba(140,125,95,.028) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(6deg, rgba(140,125,95,.022) 0 1px, transparent 1px 5px);
  color:var(--ink);
  font-family:var(--serif);
  font-size:15px;
  line-height:1.9;
  letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
.wrap{position:relative;z-index:3;max-width:760px;margin:0 auto;padding:0 18px 90px}

/* ---------- 通用零件 ---------- */
.vert{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.34em}
.seal{
  display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border:1.6px solid var(--zhu);color:var(--zhu);
  font-family:var(--kai);font-size:13px;line-height:1;border-radius:3px;
  transform:rotate(-3deg);opacity:.85;flex:none;
}
.seal.big{width:44px;height:44px;font-size:18px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line) 18%,var(--line) 82%,transparent);margin:16px 0}
.dim{color:var(--ink3);font-size:13px}
.center{text-align:center}

/* ---------- 牌坊 / 匾额 ---------- */
.gate{padding:34px 0 26px;text-align:center;position:relative}
.gate .board{
  display:inline-block;border:1px solid var(--line);
  background:linear-gradient(180deg,#fbf7ee,#efe7d6);
  box-shadow:0 2px 0 rgba(0,0,0,.04), inset 0 0 0 3px #fbf7ee, inset 0 0 0 4px #ddd2ba;
  padding:14px 20px;border-radius:2px;
}
.gate .board .t{
  font-size:26px;letter-spacing:.5em;font-weight:600;color:var(--ink);
  text-indent:.5em;
}
.gate .couplet{
  display:flex;justify-content:center;gap:26px;margin-top:16px;
}
.gate .couplet div{
  font-size:14px;line-height:2;color:var(--ink2);
  padding:9px 6px;letter-spacing:.22em;
  border-left:1px solid var(--line2);border-right:1px solid var(--line2);
}
.gate .sub{margin-top:12px;font-size:12.5px;color:var(--ink3);letter-spacing:.16em}

/* ---------- 开场 ---------- */
.prologue{padding:52px 4px 40px;text-align:center}
.prologue h1{
  font-size:40px;margin:0 0 6px;letter-spacing:.42em;text-indent:.42em;font-weight:600;
}
.prologue .sub{font-size:13px;color:var(--ink3);letter-spacing:.3em;margin-bottom:26px}
.prologue .poem{
  font-family:var(--kai);font-size:16.5px;line-height:2.5;color:var(--ink2);
  margin:22px auto 8px;max-width:16em;
}
.prologue .quote{
  margin:26px auto 0;max-width:22em;font-family:var(--kai);
  font-size:14.5px;color:var(--ink2);line-height:2.1;
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:14px 0;
}
.prologue .quote b{color:var(--zhu);font-weight:600}

/* ---------- 引路人 ---------- */
.herald{
  display:flex;gap:16px;align-items:flex-start;
  border:1px solid var(--line);background:rgba(255,253,247,.72);
  padding:16px 18px;margin:8px 0 20px;position:relative;
}
.herald:before{
  content:"";position:absolute;left:6px;top:6px;right:6px;bottom:6px;
  border:1px solid var(--line2);pointer-events:none;
}
.herald .fig{flex:none;width:64px}
.herald .fig svg{display:block;width:64px;height:88px}
.herald .who{font-size:17px;letter-spacing:.3em;margin-bottom:2px}
.herald .ti{font-size:11.5px;color:var(--ink3);letter-spacing:.18em;margin-bottom:8px}
.herald .say{font-family:var(--kai);font-size:15px;line-height:2;color:var(--ink)}
.herald .say em{font-style:normal;color:var(--zhu)}

/* ---------- 司（幕） ---------- */
.si-head{
  border:1px solid var(--line);background:linear-gradient(180deg,#fbf7ed,#f2ead9);
  padding:16px 14px;margin:26px 0 14px;text-align:center;position:relative;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
}
.si-head .nm{font-size:22px;letter-spacing:.4em;text-indent:.4em;font-weight:600}
.si-head .gl{margin-top:4px;font-size:12px;color:var(--zhe);letter-spacing:.28em}
.si-head .cl{
  margin-top:11px;display:flex;justify-content:center;gap:20px;
  font-family:var(--kai);font-size:13.5px;color:var(--ink2);letter-spacing:.14em;
}
.si-head .cl span{display:block;line-height:1.9}

/* 大橱 + 封条 */
.chest{
  border:1px solid var(--line);background:rgba(255,253,247,.6);
  padding:13px 14px;margin:0 0 16px;position:relative;overflow:hidden;
}
.chest .strip{
  position:absolute;left:50%;top:0;transform:translateX(-50%) rotate(-1.2deg);
  background:var(--zhu);color:#fdf6ec;font-size:12px;letter-spacing:.3em;
  padding:3px 16px;opacity:.9;
}
.chest .ct{
  margin-top:24px;font-size:12.5px;color:var(--ink3);letter-spacing:.1em;text-align:center;
}
.prog-line{display:flex;align-items:center;gap:9px;margin:0 0 14px}
.prog-line .bar{flex:1;height:2px;background:var(--line2);position:relative}
.prog-line .bar i{position:absolute;left:0;top:0;height:100%;background:var(--zhe);transition:width .45s}
.prog-line .lb{font-size:11px;color:var(--ink3);letter-spacing:.16em;flex:none}

/* ---------- 题目 ---------- */
.q-box{border:1px solid var(--line);background:rgba(255,254,250,.78);padding:20px 18px;margin-bottom:16px}
.q-act{font-size:11.5px;color:var(--zhe);letter-spacing:.24em;margin-bottom:7px}
.q-t{font-size:17.5px;line-height:1.95;margin-bottom:5px;font-weight:500}
.q-hint{font-size:12.5px;color:var(--ink3);margin-bottom:15px;letter-spacing:.06em}

.opt{
  display:block;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line2);background:#fdfbf5;
  padding:13px 15px;margin-bottom:9px;font-family:var(--serif);font-size:14.5px;
  line-height:1.85;color:var(--ink);transition:.16s;position:relative;
}
.opt:hover{border-color:var(--zhe);background:#fffdf7}
.opt.on{border-color:var(--zhu);background:#fdf6f2;box-shadow:inset 3px 0 0 var(--zhu)}
.opt .lead{color:var(--zhe);margin-right:7px;font-size:12px;letter-spacing:.1em}
.opt .tag{float:right;font-size:11px;color:var(--ink3);letter-spacing:.1em}
.opt.on .tag{color:var(--zhu)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid2 .opt{margin-bottom:0}

/* 排序 */
.rank-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;min-height:34px;
  border:1px dashed var(--line);padding:8px 10px;background:#fdfbf5}
.rank-wrap:empty:before{content:"点下面的词，按你在意的先后排";color:var(--ink3);font-size:12.5px}
.rank-chip{background:#f6f1e4;border:1px solid var(--line);padding:4px 11px;font-size:13px;cursor:pointer}
.rank-chip b{color:var(--zhu);font-weight:600;margin-right:5px;font-size:11px}
.rank-pool{display:flex;flex-wrap:wrap;gap:8px}
.rank-pool .rank-chip{background:#fffdf7}
.rank-pool .rank-chip.used{opacity:.32;pointer-events:none}

/* 速答 */
.qrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.qrow .lab{grid-column:1/-1;font-size:12.5px;color:var(--ink3);letter-spacing:.08em;margin-bottom:-3px}
.qbtn{border:1px solid var(--line2);background:#fdfbf5;padding:11px 12px;cursor:pointer;
  font-family:var(--serif);font-size:13.5px;line-height:1.7;color:var(--ink);text-align:center}
.qbtn.on{border-color:var(--zhu);background:#fdf6f2;color:var(--zhu)}

/* 滑块 */
.sl{width:100%;margin:8px 0 4px;-webkit-appearance:none;appearance:none;height:26px;background:transparent}
.sl::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,#5b7f88,#d8cfba 48%,#b5654a);border-radius:2px}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fdfbf5;border:2px solid var(--zhu);margin-top:-9px;cursor:pointer}
.sl::-moz-range-track{height:3px;background:linear-gradient(90deg,#5b7f88,#d8cfba 48%,#b5654a)}
.sl::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fdfbf5;border:2px solid var(--zhu);cursor:pointer}
.sl-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3)}
.sl-mid{text-align:center;font-size:14px;color:var(--zhu);margin-top:6px;font-family:var(--kai)}

/* 身体图 */
.bodywrap{display:flex;gap:12px;justify-content:center;margin:6px 0 12px}
.bodywrap svg{width:132px;height:240px;flex:none}
.hit{cursor:pointer;transition:.15s}
.hit:hover{opacity:.75}
.hit.on{fill:var(--zhu);opacity:.62}
.bodylist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px}
.bodylist span{font-size:12px;border:1px solid var(--line);padding:2px 9px;background:#fdfbf5;color:var(--ink2)}
.bodylist span.hot{border-color:var(--zhu);color:var(--zhu)}

/* ---------- Echo（仙姑批语） ---------- */
.echo{
  border:1px solid var(--line);border-left:3px solid var(--zhu);
  background:linear-gradient(90deg,#fbf6ec,#fdfbf6);
  padding:12px 15px;margin:12px 0 4px;font-family:var(--kai);
  font-size:14.5px;line-height:2;color:var(--ink);
  display:none;
}
.echo.show{display:block;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.echo b{color:var(--zhu);font-weight:600}
.echo .sign{display:block;margin-top:6px;font-size:11.5px;color:var(--ink3);letter-spacing:.16em;font-family:var(--serif)}

/* 下一步 */
.nextbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.btn{
  border:1px solid var(--ink2);background:var(--ink);color:var(--paper);
  padding:9px 24px;font-family:var(--serif);font-size:14px;letter-spacing:.24em;
  cursor:pointer;transition:.16s;
}
.btn:hover{background:#3d362f}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{background:#f3ede0;color:var(--ink)}
.btn[disabled]{opacity:.3;cursor:not-allowed}

/* ---------- 册页（每司收束） ---------- */
.leaf{
  border:1px solid var(--line);background:
    linear-gradient(180deg,#fdfbf3,#f6f0e2);
  padding:0;margin:18px 0;position:relative;
}
.leaf .inner{border:1px solid var(--line2);margin:7px;padding:16px 14px}
.leaf .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.leaf .lh .t{font-size:13px;letter-spacing:.26em;color:var(--zhe)}
.leaf .pic{text-align:center;margin:8px 0 12px}
.leaf .pic svg{width:180px;height:120px}
.leaf .verdict{
  font-family:var(--kai);font-size:16px;line-height:2.15;text-align:center;
  color:var(--ink);letter-spacing:.06em;
}
.leaf .verdict b{color:var(--zhu);font-weight:600}
.leaf .note{margin-top:10px;font-size:12.5px;color:var(--ink3);line-height:1.9;
  border-top:1px solid var(--line2);padding-top:9px}

/* ---------- 结果：三册 ---------- */
.result{margin-top:10px}
.big-gate{padding:40px 0 20px;text-align:center}
.big-gate .t1{font-size:13px;letter-spacing:.42em;color:var(--ink3);margin-bottom:10px}
.big-gate .t2{font-size:34px;letter-spacing:.34em;text-indent:.34em;font-weight:600}
.big-gate .t3{margin-top:12px;font-family:var(--kai);font-size:14.5px;color:var(--ink2);letter-spacing:.1em}

.sec{border:1px solid var(--line);background:rgba(255,254,250,.8);padding:18px 17px;margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2);
  padding-bottom:9px;margin-bottom:13px}
.sec-h .n{
  width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--paper);font-size:13px;font-family:var(--kai);
}
.sec-h .t{font-size:16px;letter-spacing:.24em}
.sec-h .r{margin-left:auto;font-size:11.5px;color:var(--ink3);letter-spacing:.14em}
.sec h4{font-size:14px;margin:14px 0 7px;letter-spacing:.14em;color:var(--zhe);font-weight:600}
.sec p{margin:0 0 10px;line-height:2.05}

.juan{border:1px solid var(--line);background:linear-gradient(180deg,#fdfbf3,#f6f0e2);
  padding:0;margin-bottom:16px}
.juan .inner{border:1px solid var(--line2);margin:7px;padding:16px 15px}
.juan .jh{text-align:center;font-size:12.5px;letter-spacing:.34em;color:var(--zhe);margin-bottom:12px}
.juan .pic{text-align:center;margin:10px 0 14px}
.juan .pic svg{width:230px;height:150px}
.juan .panci{
  font-family:var(--kai);font-size:19px;line-height:2.3;text-align:center;
  color:var(--ink);letter-spacing:.1em;margin:6px 0 4px;
}
.juan .panci .zh{color:var(--zhu)}
.juan .ming{margin-top:14px;text-align:center;font-size:24px;letter-spacing:.2em;
  color:var(--ink);font-weight:600}
.juan .ming small{display:block;font-size:11.5px;color:var(--ink3);letter-spacing:.26em;
  margin-top:5px;font-weight:400}
.juan .ci{margin-top:12px;font-family:var(--kai);font-size:15px;line-height:2.1;
  color:var(--ink2);padding:0 4px}
.juan .ci b{color:var(--zhu);font-weight:600}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:4px 0 10px}
.kv dt{color:var(--ink3);font-size:12.5px;letter-spacing:.14em;white-space:nowrap}
.kv dd{margin:0;line-height:1.9}

.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px}
.chain span{font-size:13px;border:1px solid var(--line);background:#fdfbf5;padding:4px 10px;color:var(--ink2)}
.chain i{font-style:normal;color:var(--zhe);font-size:12px}

.rx5{border-left:2px solid var(--zhe);padding:2px 0 2px 13px;margin:12px 0}
.rx5 .lv{font-size:12px;color:var(--zhe);letter-spacing:.2em;margin-bottom:3px}
.rx5 .tx{font-size:14px;line-height:2}

.warn{border:1px solid var(--zhu);background:#fdf4f0;padding:14px 15px;margin:12px 0}
.warn .h{font-size:14px;color:var(--zhu);letter-spacing:.2em;margin-bottom:8px;font-weight:600}
.warn p{font-size:13.5px;line-height:2;margin:0 0 7px;color:var(--ink)}
.warn .hot{font-size:14px;color:var(--zhu);font-weight:600;line-height:2.1}

.note-box{border:1px dashed var(--line);background:#faf6ec;padding:13px 14px;
  font-size:12.5px;line-height:1.95;color:var(--ink2);margin:14px 0}
.note-box b{color:var(--zhu)}

.tools{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:20px 0 10px}
.tools .btn{padding:8px 16px;font-size:13px;letter-spacing:.16em}

/* 浮层 */
.veil{position:fixed;inset:0;background:rgba(38,32,26,.9);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:26px;
  opacity:0;pointer-events:none;transition:.5s}
.veil.on{opacity:1;pointer-events:auto}
.veil .panel{max-width:470px;width:100%;border:1px solid var(--gold);
  background:linear-gradient(180deg,#fbf7ec,#f3ecdb);padding:26px 24px;position:relative;text-align:center}
.veil .panel:before{content:"";position:absolute;inset:6px;border:1px solid rgba(176,141,71,.35);pointer-events:none}
.veil .vg{font-size:12px;letter-spacing:.4em;color:var(--zhe);margin-bottom:12px}
.veil .vt{font-size:23px;letter-spacing:.3em;text-indent:.3em;margin-bottom:14px}
.veil .vb{font-family:var(--kai);font-size:15px;line-height:2.15;color:var(--ink);text-align:left}
.veil .vb em{font-style:normal;color:var(--zhu)}
.veil .vb .cl{display:block;text-align:center;margin-top:14px;font-size:13.5px;color:var(--ink2)}
.veil .vbtn{margin-top:20px}
.veil .vbtn .btn{width:100%}

@media(max-width:560px){
  .wrap{padding:0 13px 80px}
  .prologue h1{font-size:31px}
  .grid2{grid-template-columns:1fr}
  .qrow{grid-template-columns:1fr}
  .herald .fig,.herald .fig svg{width:52px;height:74px}
  .gate .board .t{font-size:21px}
  .juan .panci{font-size:17px}
  .si-head .cl{flex-direction:column;gap:2px}
  .bodywrap svg{width:118px;height:214px}
}

/* ---------- 虚境 · 云雾与意境 ---------- */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(78% 42% at 18% -6%, rgba(160,127,66,.05), transparent 60%),
    radial-gradient(70% 46% at 92% 108%, rgba(70,112,122,.06), transparent 62%),
    radial-gradient(120% 60% at 50% 40%, rgba(255,253,247,0), rgba(43,38,34,.05) 130%);
}
.xu-fog{position:fixed;left:-10%;right:-10%;top:-50px;height:320px;z-index:1;pointer-events:none;
  background:
    radial-gradient(60% 100% at 28% 0%, rgba(244,239,228,.92), rgba(244,239,228,0) 70%),
    radial-gradient(52% 100% at 76% 0%, rgba(244,239,228,.72), rgba(244,239,228,0) 70%);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 88%);
  mask-image:linear-gradient(180deg,#000,transparent 88%);
  animation:xuDrift 19s ease-in-out infinite alternate;}
@keyframes xuDrift{from{transform:translateX(-2%) translateY(-4px)}to{transform:translateX(3%) translateY(9px)}}
.xu-vig{position:fixed;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 200px 30px rgba(43,38,34,.06)}
.xu-loc{display:block;width:1.3em;margin:0 auto 14px;color:var(--zhe);font-size:12.5px;letter-spacing:.3em}
.big-gate .couplet2{display:flex;justify-content:center;gap:24px;margin:16px 0 4px}
.big-gate .couplet2 div{font-size:14px;line-height:2;color:var(--ink2);letter-spacing:.22em;
  border-left:1px solid var(--line2);border-right:1px solid var(--line2);padding:8px 10px}
.zan{font-family:var(--kai);font-size:13.5px;line-height:2.05;color:var(--ink2);text-align:center;margin:6px 8px 14px;letter-spacing:.04em}
.vlabel{text-align:center;font-family:var(--kai);font-size:12px;letter-spacing:.3em;color:var(--zhe);margin:2px 0 7px}
.xu-out{margin:6px 0 4px}

/* ---------- 打印 ---------- */
@media print{
  body{background:#fff}
  .veil,.tools,.nextbar,.noprint,.xu-fog,.xu-vig,.xu-out{display:none!important}
  .sec,.juan,.leaf{break-inside:avoid;page-break-inside:avoid}
  .sec-h{break-after:avoid}
  .wrap{max-width:none;padding:0}
}
</style>

<style id="ce-style">
.ce-img{display:block;margin:8px auto 4px;width:min(66%,250px);max-width:82%;height:auto;
  border-radius:10px;border:1px solid var(--line,rgba(80,60,30,.18));box-shadow:0 10px 26px rgba(70,55,30,.16);}
.herald .fig{width:auto;flex:none}
.herald .fig img.fig-img{width:70px;height:96px;object-fit:cover;display:block;border-radius:8px;

/* ══════════ 司二 · 结怨司（怨 · 闻） ══════════ */
{id:'B1', si:'jieyuan', type:'single',
 q:'有对夫妻吵了一夜。第二天她病了。他给她端水、买药，一边委屈得掉眼泪。\n你听完，第一句想说什么？',
 hint:'这是别人的事，也是你的事',
 opts:[
  {t:'「她心太软了。」', w:{xing:{tu:3},zang:{pi:3},need:{needed:3},ev:['心软'],zhi:{si:2}},
   echo:'你说她心软，是因为<b>你也一样</b>。倔强加心软，是这世上最伤自己的一副性子。'},
  {t:'「他凭什么？」', w:{xing:{mu:3},zang:{gan:3},zhi:{nu:3},need:{auto:2},ev:['委屈不外扬']},
   echo:'你替她不平。<b>你心里也有一个「凭什么」，一直没处说。</b>'},
  {t:'「她图什么呢。」', w:{xing:{jin:3},zang:{fei:3},zhi:{you:3},need:{understood:2}},
   echo:'你不是不明白她图什么，你是<b>替她觉得不值</b>。'},
  {t:'「这日子怎么过下去的。」', w:{xing:{shui:3},zang:{shen:3},zhi:{kong:3},need:{safe:3}},
   echo:'你看见的是<b>日子本身</b>——你怕的也是这个：一天一天，怎么熬到头。'},
  {t:'「病是这么来的。」', w:{xing:{huo:2},zang:{xin:2},need:{faith:2},ev:['看出病根'],zhi:{si:1}},
   echo:'你一眼就看见了病根。<b>看得太透的人，活得都不轻省。</b>'}
 ]},
{id:'B2', si:'jieyuan', type:'multi',
 q:'那个结，卡在什么地方？',
 hint:'可多选。身体会替你说出来',
 opts:[
  {t:'喉咙——想说又说不出口', w:{zang:{gan:3},xing:{mu:2},ev:['咽中如有物梗'],need:{understood:2}},
   echo:'这叫梅核气。<b>气卡在半道上，吐不出，咽不下</b>——是话没说出去。'},
  {t:'胸口——闷着，透不过气', w:{zang:{fei:3},xing:{jin:2},ev:['胸闷'],zhi:{you:2}},
   echo:'肺主气，也主悲。<b>你把叹气都省了，气就堵在这儿。</b>'},
  {t:'胃里——吃不下，胀着', w:{zang:{pi:3},xing:{tu:2},ev:['胃胀纳呆'],zhi:{si:2}},
   echo:'胃是情绪的海绵。<b>别人给你气受，你的胃替你受了。</b>'},
  {t:'两胁——胀，有时候窜着疼', w:{zang:{gan:3},xing:{mu:2},ev:['两胁胀闷'],zhi:{nu:2}},
   echo:'两胁是肝的地盘。<b>你忍一次，这里就紧一分。</b>'},
  {t:'腰上——酸，往下坠', w:{zang:{shen:3},xing:{shui:2},ev:['腰膝酸软'],zhi:{kong:2}},
   echo:'腰为肾之府。<b>撑太久的人，先塌的是腰。</b>'},
  {t:'也说不上哪儿，就是累', w:{zang:{pi:2},xing:{tu:2},ev:['说不清哪里难受'],need:{noburden:2}},
   echo:'说不清部位的累，最是真。<b>那是整个人的气都提不起来了。</b>'}
 ]},
{id:'B3', si:'jieyuan', type:'single',
 q:'咽下去的那些话，最后变成了什么？',
 hint:'咽下去不等于没了',
 opts:[
  {t:'变成了对别人更好', w:{need:{needed:4},xing:{tu:2},zang:{pi:2},ev:['付出型']},
   echo:'你把委屈炼成了好处给人。<b>你求的是别人脸上那一点欣慰——只是这味药，比买票贵太多了。</b>'},
  {t:'变成了半夜醒过来', w:{zang:{xin:3},xing:{huo:2},ev:['入睡困难 / 多梦'],zhi:{si:2}},
   echo:'白天装好的，夜里自己开了箱。<b>你不是睡不着，是不敢睡。</b>'},
  {t:'变成了身上的一处疼', w:{zang:{gan:2},xing:{mu:2},ev:['气滞成疼'],zhi:{nu:2}},
   echo:'气滞则血瘀，血瘀则痛。<b>你的身体在替你把那句话说出来。</b>'},
  {t:'变成了什么都不想说', w:{need:{understood:3},xing:{jin:2},zang:{fei:2},ev:['玻璃杯状态'],risk:1},
   echo:'像扣在一只玻璃杯里：外面什么都看得见，<b>能量就是接不上</b>。这就是郁。'},
  {t:'好像也没变成什么，就这么过去了', w:{need:{noburden:3},ev:['习惯了'],zhi:{si:1}},
   echo:'过不去的，才叫结。<b>你说过去了，是因为你学会了不看它。</b>'}
 ]},

{id:'C1', si:'zhaoti', type:'single',

 ]},

{id:'E1', si:'chungan', type:'slider',

 echo:['<b>常年怕冷。</b>阳气不达四末，你身上那炉火烧不到梢上。八髎、命门这两处，比什么都补。',
       '<b>手脚凉。</b>这是气不够，推不到末梢。泡脚要泡到小腿肚，水要没过踝。',
       '<b>不冷不热。</b>这是最好的一种——说明你那口气还匀。',
       '<b>容易上火。</b>上的是虚火。阴水不够，浇不灭那点火。',
       '<b>五心烦热。</b>手心脚心加心口，五处都热——这是阴虚，阴不敛阳。']
},

/* ==================================================================
   引擎
   ================================================================== */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function addW(w, undo){
  if(!w) return;
  var s = undo ? -1 : 1;
  ['zhi','xing','zang','need'].forEach(function(ch){
    if(!w[ch]) return;
    for(var k in w[ch]){ V[ch][k] = (V[ch][k]||0) + s*w[ch][k]; }
  });
  if(w.ev) w.ev.forEach(function(e){
    var i = V.ev.indexOf(e);
    if(undo){ if(i>=0) V.ev.splice(i,1); }
    else { if(i<0) V.ev.push(e); }
  });
  if(w.risk){ V.risk += s*w.risk; if(!undo && w.risk>MAXRISK) MAXRISK = w.risk; }
}

function topOf(o, names){
  var a = [];
  for(var k in o){ if(o[k]>0 && names[k]) a.push({k:k, n:names[k], v:o[k]}); }
  a.sort(function(x,y){ return y.v - x.v; });
  return a;
}
function topK(o, names, n){ return topOf(o,names).slice(0,n||1); }

/* 显影度 = 答题进度(0.55) + 自我暴露深度(0.45) */
function clarityOf(){
  var total = Q.length, done = 0;
  Q.forEach(function(q){ if(ANSWER[q.id]!==undefined && !isSkipped(q)) done++; });
  var prog = total ? done/total : 0;
  var open = 0;
  V.ev.forEach(function(e){
    if(/念头|不照镜子|玻璃杯|无人可说|十年|记不清|自伤|行动|打算|咽下去|排在最前|手脚凉|常年怕冷|五心烦热/.test(e)) open += 1;
  });
  var depth = Math.min(1, open/3);
  return Math.min(0.96, 0.42*prog + 0.58*depth);
}

function riskLevel(){
  var auto = 0;
  V.ev.forEach(function(e){
    if(e==='有过行动' || e==='有过打算' || e==='近期自伤念头') auto = Math.max(auto,4);
    else if(e==='想过办法' || e==='常有自伤念头') auto = Math.max(auto,3);
    else if(e==='不化妆 + 出门不照镜子' || e==='无人可说') auto = Math.max(auto,2);
    else if(e==='玻璃杯状态' || e==='偶发自伤念头') auto = Math.max(auto,1);
  });
  if(/十年|记不清/.test(V.ev.join(',')) && auto<2) auto = 2;
  return Math.max(auto, MAXRISK>0 ? Math.min(4, Math.ceil(MAXRISK/1)) : 0);
}

function isSkipped(q){
  if(q.cond){
    var a = ANSWER[q.cond];
    if(a===undefined || (a && a.v===0)) return true;
  }
  return false;
}

/* ==================================================================
   流程（序 → 牌坊 → 宫门 → 七司 → 册页 → 三册）
   ================================================================== */
var stage = 'prologue';   // prologue | gate | quiz | result
var gateStep = 0;
var fi = 0;               // flow 索引
var FLOW = [];

function buildFlow(){
  FLOW = [];
  var lastSi = null;
  Q.forEach(function(q, i){
    if(q.si !== lastSi){ FLOW.push({kind:'si', si:q.si}); lastSi = q.si; }
    FLOW.push({kind:'q', q:q});
    var nx = Q[i+1];
    if(!nx || nx.si !== q.si) FLOW.push({kind:'leaf', si:q.si});
  });
}

/* ---------- 作答 ---------- */
function pick(oi){
  var q = Q[qi]; if(!q) return;
  var prev = ANSWER[q.id];
  if(prev !== undefined && prev.v===oi){ return; }         // 单选重复点：不变化
  if(prev !== undefined && prev.type==='single'){ addW(q.opts[prev.v].w, true); }
  ANSWER[q.id] = {type:'single', v:oi};
  addW(q.opts[oi].w, false);
  afterAnswer(q, q.opts[oi].echo, q.opts[oi].w);
}
function pickMulti(oi){
  var q = Q[qi]; if(!q) return;
  var st = ANSWER[q.id] || {type:'multi', v:[]};
  var i = st.v.indexOf(oi);
  if(i>=0){ st.v.splice(i,1); addW(q.opts[oi].w, true); }
  else { st.v.push(oi); addW(q.opts[oi].w, false); }
  ANSWER[q.id] = st;
  renderQuestion(q.opts[oi].echo, (i>=0));
  var nd = document.getElementById('dNext');
  if(nd) nd.disabled = st.v.length===0;
}
function pickQuick(gi, side){
  var q = Q[qi]; if(!q) return;
  var st = ANSWER[q.id] || {type:'quick', v:{}};
  var g = q.groups[gi], o = g[side];
  if(st.v[gi]===side){ return; }
  if(st.v[gi]) addW(g[st.v[gi]].w, true);
  st.v[gi] = side; addW(o.w, false);
  ANSWER[q.id] = st;
  var all = q.groups.every(function(_,i){ return st.v[i]; });
  renderQuestion(o.echo, false);
  var nd = document.getElementById('dNext'); if(nd) nd.disabled = !all;
}
var LAST_RANK = {};
function applyRank(q){
  var st = ANSWER[q.id] || {type:'rank', v:[]};
  var w = {zhi:{},xing:{},zang:{},need:{},ev:[]};
  st.v.forEach(function(idx, rank){
    var mult = rank===0?3:(rank===1?2:1);
    var it = q.items[idx];
    if(!it || !it.w) return;
    ['zhi','xing','zang','need'].forEach(function(ch){
      if(!it.w[ch]) return;
      for(var k in it.w[ch]){ w[ch][k] = (w[ch][k]||0) + it.w[ch][k]*mult; }
    });
    if(it.w.ev) it.w.ev.forEach(function(e){ w.ev.push(e); });
  });
  return w;
}
function pickRank(ii){
  var q = Q[qi]; if(!q) return;
  var st = ANSWER[q.id] || {type:'rank', v:[]};
  var cur = applyRank(q);
  var i = st.v.indexOf(ii);
  if(i>=0){ st.v.splice(i,1); }
  else { st.v.push(ii); }
  var nxt = applyRankFor(q, st);
  addW(cur, true); addW(nxt, false);
  ANSWER[q.id] = st;
  var it = q.items[ii];
  var txt = (i>=0)
    ? '撤下了「'+it.t+'」。'
    : '第 '+st.v.length+' 位：<b>'+it.t+'</b>'+(st.v.length===1?'——这一样，排在最前。':'。');
  renderQuestion(txt, false);
  var nd = document.getElementById('dNext'); if(nd) nd.disabled = st.v.length===0;
}
function applyRankFor(q, st){
  var w = {zhi:{},xing:{},zang:{},need:{},ev:[]};
  st.v.forEach(function(idx, rank){
    var mult = rank===0?3:(rank===1?2:1);
    var it = q.items[idx];
    if(!it || !it.w) return;
    ['zhi','xing','zang','need'].forEach(function(ch){
      if(!it.w[ch]) return;
      for(var k in it.w[ch]){ w[ch][k] = (w[ch][k]||0) + it.w[ch][k]*mult; }
    });
    if(it.w.ev) it.w.ev.forEach(function(e){ w.ev.push(e); });
  });
  return w;
}
function pickSlider(val){
  var q = Q[qi]; if(!q) return;
  var n = q.lab.length, i = Math.max(0, Math.min(n-1, val));
  var prev = ANSWER[q.id];
  ANSWER[q.id] = {type:'slider', v:i};
  var w = {ev:[q.lab[i]], zang:{}, xing:{}, zhi:{}, need:{}};
  if(i===0){ w.zang={shen:1,pi:1}; w.xing={shui:1}; }
  else if(i===1){ w.zang={shen:1}; w.xing={shui:1}; }
  else if(i===3){ w.zang={xin:2}; w.xing={huo:2}; }
  else if(i===4){ w.zang={shen:2,xin:1}; w.xing={shui:2}; }
  if(prev!==undefined && prev.v!==i){ addW(sliderW(q,prev.v), true); }
  addW(w, false);
  renderQuestion(q.echo[i], false);
  var nd = document.getElementById('dNext'); if(nd) nd.disabled=false;
}
function sliderW(q, i){
  var w = {ev:[q.lab[i]], zang:{}, xing:{}, zhi:{}, need:{}};
  if(i===0){ w.zang={shen:1,pi:1}; w.xing={shui:1}; }
  else if(i===1){ w.zang={shen:1}; w.xing={shui:1}; }
  else if(i===3){ w.zang={xin:2}; w.xing={huo:2}; }
  else if(i===4){ w.zang={shen:2,xin:1}; w.xing={shui:2}; }
  return w;
}
function bodyClick(id){
  var q = Q[qi]; if(!q) return;
  var st = ANSWER[q.id] || {type:'body', v:[]};
  var all = BODY_FRONT.concat(BODY_BACK);
  var m = null; all.forEach(function(x){ if(x.id===id) m = x; });
  if(!m) return;
  var i = st.v.indexOf(id);
  if(i>=0){ st.v.splice(i,1); addW(m.w, true); }
  else { st.v.push(id); addW(m.w, false); }
  ANSWER[q.id] = st;
  renderQuestion(i>=0 ? ('撤下了「'+m.n+'」。') : ('<b>'+m.n+'</b> —— '+m.d), false);
  var nd = document.getElementById('dNext'); if(nd) nd.disabled = st.v.length===0;
}

function afterAnswer(q, echo){
  renderQuestion(echo, false);
  var nd = document.getElementById('dNext'); if(nd) nd.disabled=false;
}

/* ---------- 导航 ---------- */
function next(){
  if(stage==='prologue'){ stage='gate'; gateStep=0; render(); return; }
  if(stage==='gate'){
    gateStep++;
    if(gateStep>=2){ stage='quiz'; fi=0; buildFlow(); syncQi(); }
    render(); return;
  }
  if(stage==='quiz'){
    fi++;
    while(fi<FLOW.length){
      var f = FLOW[fi];
      if(f.kind==='q' && isSkipped(f.q)){ fi++; continue; }
      break;
    }
    if(fi>=FLOW.length){ stage='result'; render(); return; }
    syncQi(); render();
    return;
  }
}
function prev(){
  if(stage==='gate'){ if(gateStep>0){ gateStep--; render(); } else { stage='prologue'; render(); } return; }
  if(stage!=='quiz') return;
  fi--;
  while(fi>0){
    var f = FLOW[fi];
    if(f.kind==='q' && isSkipped(f.q)){ fi--; continue; }
    break;
  }
  if(fi<0){ stage='gate'; gateStep=1; render(); return; }
  syncQi(); render();
}
function syncQi(){
  var f = FLOW[fi];
  if(f && f.kind==='q'){ qi = Q.indexOf(f.q); }
}

/* ==================================================================
   渲染
   ================================================================== */
function app(){ return document.getElementById('app'); }

function render(){
  var a = app(); if(!a) return;
  if(stage==='prologue'){ a.innerHTML = viewPrologue(); bindPrologue(); }
  else if(stage==='gate'){ a.innerHTML = viewGate(); bindGate(); }
  else if(stage==='quiz'){
    var f = FLOW[fi];
    if(!f){ stage='result'; render(); return; }
    if(f.kind==='si'){ a.innerHTML = viewSi(f.si); bindNav(); }
    else if(f.kind==='leaf'){ a.innerHTML = viewLeaf(f.si); bindNav(); }
    else { renderQuestion(null,false,true); }
  }

/* 每司册页断语 */
function leafVerdict(k){
  var x = topK(V.xing,XING_N,1), z = topK(V.zang,ZANG_N,2),
      nd = topK(V.need,NEED_N,1), zh = topK(V.zhi,ZHI_N,1);
  var xn = x.length? x[0].n : '—';
  var zn = z.length? (z[1]? z[0].n+z[1].n+'同病' : z[0].n+'气先伤') : '—';
  var nn = nd.length? nd[0].n : '—';
  if(k==='chiqing')
    return {verdict:'此页所记：你心里搁着的，是<b>'+(V.ev.filter(function(e){return /放不下|没说出口|没做完|人情|从前|说不出/.test(e);}).slice(0,2).join('、')||'那一桩不肯命名的心事')+'</b>。',
            note:'痴情司的账，记的不是情，是「放不下」三个字。放不下不是错，错的是它一直没名字。'};
  if(k==='jieyuan')
    return {verdict:'此页所记：这个结，卡在<b>'+zn+'</b>上。',
            note:'咽下去的话不会消失，它会换个地方长出来。你身上那一处疼，多半就是它。'};
  if(k==='zhaoti')
    return {verdict:'此页所记：人前那个你，求的是<b>'+nn+'</b>。',
            note:'白日里那一本账最会骗人——连你自己都快信了。好在身体不信。'};
  if(k==='yeyuan')
    return {verdict:'此页所记：灯灭以后，你要的是<b>'+nn+'</b>。',
            note:'夜里的那一本才是真账。白天装好的，夜里自己开箱。'};
  if(k==='chungan')
    return {verdict:'此页所记：你走到<b>'+xn+'</b>，身上的寒热已经分明。',
            note:'春该生发而生不起来，叫郁。郁久了，要么化火，要么成湿。'};
  if(k==='qiubei')
    return {verdict:'此页所记：身上先败的，是<b>'+zn.replace('同病','、').replace('气先伤','')+'</b>这一片。',
            note:'秋主收敛。收得太狠就成了悲——悲忧伤肺，肺又主一身之气。'};
  return {verdict:'此页所记：此心可省，此身可医。',
          note:'省心司只问两句，却是最要紧的两句。肯答，就是还在找出口。'};
}

  var H = '';
  H += '<div class="prog-line"><span class="lb">'+s.nm+' · '+s.gl+'</span>' +

  H += '<div class="q-box">';
  H += '<div class="q-act">'+s.no+' · '+s.nm+'　'+h.name+'</div>';

  if(q.type==='single' || q.type==='multi'){
    H += '<div id="optBox">';

    });
    H += '</div>';
  }
  else if(q.type==='quick'){
    H += '<div id="quickBox">';
    q.groups.forEach(function(g,gi){
      var st = ANSWER[q.id] || {v:{}};
      H += '<div class="qrow"><div class="lab">'+(gi+1)+' · '+esc(g.lab)+'</div>';
      H += '<button class="qbtn'+(st.v[gi]==='a'?' on':'')+'" data-g="'+gi+'" data-s="a">'+esc(g.a.t)+'</button>';
      H += '<button class="qbtn'+(st.v[gi]==='b'?' on':'')+'" data-g="'+gi+'" data-s="b">'+esc(g.b.t)+'</button>';
      H += '</div>';
    });
    H += '</div>';
  }
  else if(q.type==='rank'){
    var st = ANSWER[q.id] || {v:[]};
    H += '<div class="rank-wrap" id="rankWrap">';
    st.v.forEach(function(idx,r){
      H += '<span class="rank-chip" data-i="'+idx+'"><b>'+(r+1)+'</b>'+esc(q.items[idx].t)+'</span>';
    });
    H += '</div><div class="rank-pool" id="rankPool">';
    q.items.forEach(function(it,i){
      var used = st.v.indexOf(i)>=0;
      H += '<span class="rank-chip'+(used?' used':'')+'" data-i="'+i+'">'+esc(it.t)+'</span>';
    });
    H += '</div>';
  }
  else if(q.type==='slider'){
    var v = (ANSWER[q.id] && ANSWER[q.id].v!==undefined) ? ANSWER[q.id].v : Math.floor(q.lab.length/2);
    var touched = (ANSWER[q.id] !== undefined);
    H += '<div class="slider-box">' +
      '<input type="range" class="sl" id="sl" min="0" max="'+(q.lab.length-1)+'" value="'+v+'" step="1">' +
      '<div class="sl-lab"><span>'+esc(q.lab[0])+'</span><span>'+esc(q.lab[q.lab.length-1])+'</span></div>' +
      '<div class="sl-mid" id="slMid"'+(touched?'':' style="color:var(--ink3)"')+'>'+
        (touched? esc(q.lab[v]) : '（未落笔 · 拖一下，或直接过去）')+'</div></div>';
  }
  else if(q.type==='body'){
    var st2 = ANSWER[q.id] || {v:[]};
    H += '<div class="bodywrap">' + bodySVG('front', st2.v) + bodySVG('back', st2.v) + '</div>';
    H += '<div class="bodylist" id="bodyList">';
    st2.v.forEach(function(id){
      var m=null; BODY_FRONT.concat(BODY_BACK).forEach(function(x){ if(x.id===id) m=x; });
      if(m) H += '<span class="hot">'+esc(m.n)+'</span>';
    });
    H += '</div>';
  }
  H += '<div class="echo'+(echo?' show':'')+'" id="dEcho">'+(echo||'')+
       (echo?'<span class="sign">— '+h.name+'</span>':'')+'</div>';
  H += '</div>';
  /* 滑块题允许不拖直接过（视为未记），其余题须先落笔 */
  var needWait = (ANSWER[q.id]===undefined) && q.type!=='slider';
  H += '<div class="nextbar noprint">' +
       '<button class="btn ghost" id="dPrev">退 一 步</button>' +
       '<button class="btn" id="dNext"'+(needWait?' disabled':'')+'>记 上 这 一 笔</button>' +
       '</div>';
  host.innerHTML = H;
  bindQuestion(q);
  if(fresh) window.scrollTo(0,0);
}

function thermalText(){
  var hot = false, cold = false;
  V.ev.forEach(function(e){
    if(/烦热|上火|口干|口苦|心烦|口疮|盗汗|内热/.test(e)) hot = true;
    if(/畏寒|怕冷|手脚凉|下焦寒|八髎寒|寒湿|常年怕冷/.test(e)) cold = true;
  });
  if(hot && cold) return '上热下寒。上面口干口疮，下面腰腹发凉——这是中焦堵住了，水火不交。';
  if(hot) return '偏热。多是虚火：阴水不够，浇不灭那点火。清火清不掉，得补阴。';
  if(cold) return '偏寒。阳气不达四末，身上那炉火烧不到梢上。八髎、命门，比什么都补。';
  return '寒热不显。说明你那口气还匀，这是好事。';
}
function sleepText(){
  var t = [];
  V.ev.forEach(function(e){
    if(/入睡困难|多梦|易醒|早醒|睡眠|睡/.test(e)) t.push(e);
  });
  if(!t.length) return '（未记）——若一向安眠，这一条是你的福气。';
  return t.join(' · ');
}
function riskText(lv){
  var H = '';
  if(lv===0){
    H += '<p>气机未见明显偏失。<b>此册不必当回事，只当照了一次镜子。</b></p>';
    H += '<p>若要说一句：顺时而卧，少思少虑，比什么补药都强。</p>';
  } else if(lv===1){
    H += '<p>气机轻度失调。还在<b>「气」这一层</b>，尚未及血、及形。</p>';
    H += '<p>这时候回头最快——别等它扎了根。先睡好，先把话说出来。</p>';
  } else if(lv===2){
    H += '<p>气滞湿困。已经从「一股气」变成「一处堵」了。</p>';
    H += '<p>这一级的关键词是<b>出口</b>：气要有地方出，话要有人听，汗要能出来。' +
         '三样里先打通一样，人就松快一半。</p>';
  } else if(lv===3){
    H += '<p>能量已经停住。像扣在一只玻璃杯里——外面什么都看得见，<b>能量就是接不上</b>。</p>';
    H += '<div class="warn"><div class="h">请 认 真 看 这 一 段</div>' +
         '<p>这个程度，已经不是「想开点」「出去走走」能解决的了。' +
         '它涉及神经递质和内分泌，是<b>可以治、也该治</b>的病，不是性格问题，更不是你的错。</p>' +
         '<p>请去正规医院的精神心理科或心身医学科评估一次。' +
         '与此同时，中医的情志调理可以作为<b>辅助</b>，但不要拿来替代规范诊疗。</p>' +
         '<p class="hot">若身边有人告诉你「你就是想太多」——那句话，请不要听进去。</p></div>';
  } else {
    H += '<p>需要立刻有人接手。</p>';
    H += '<div class="warn"><div class="h">现 在 就 去 找 人</div>' +
         '<p>你愿意把这一页走完、把这些话打出来，这本身就是<b>还没放弃</b>的意思。' +
         '但请你不要一个人扛这一段。</p>' +
         '<p class="hot">请立刻联系：身边最可靠的那个人，或前往最近的医院急诊。</p>' +
         '<p>全国 24 小时心理援助热线　<b>12356</b><br>' +
         '北京心理危机研究与干预中心　<b>010-82951332</b><br>' +
         '上海心理热线　<b>021-962525</b></p>' +
         '<p>以上号码如有变动请以官方公布为准。若情况紧急，请直接拨打 120。</p></div>';
  }
  return H;
}
function buildReportText(){
  var x = topK(V.xing,XING_N,1), mainX = x.length? x[0].k : 'tu';
  var z = topK(V.zang,ZANG_N,2), z1 = z.length? z[0].k:'pi', z2 = z.length>1? z[1].k:null;
  var nd = topK(V.need,NEED_N,1), n1 = nd.length? nd[0].k:'noburden';
  var P = PANCI[mainX], T = XING_TYPE[mainX], R = NEED_RX[n1];
  var lv = riskLevel();
  var L = [];
  L.push('《太虚册》· 情志自诊记录');
  L.push('────────────────');
  L.push('【又副册 · 形】病位：'+(z2?ZANG_N[z1]+ZANG_N[z2]+'同病':ZANG_N[z1]+'气先伤'));
  L.push('病机链：'+chainOf(z1,z2).join(' → '));
  L.push('寒热：'+thermalText());
  L.push('记录：'+(V.ev.length?V.ev.join(' · '):'无'));
  L.push('');
  L.push('【副册 · 气】'+XING_N[mainX]+'型 · '+T.name);
  L.push(T.desc);
  L.push('心药：你不是「'+R.neg+'」，你是在'+R.pos+'。'+R.cost);
  L.push('');
  L.push('【正册 · 命】'+P.ming.replace(/\s/g,''));
  P.ci.forEach(function(c){ L.push('　'+c[0]+'，'+c[1]+'。'); });
  L.push(P.jie);
  L.push('');
  L.push('【心药五层】');
  RX5[mainX].forEach(function(r){ L.push('· '+r[0]+'：'+r[1]); });
  L.push('');
  L.push('【气机定级】'+RLV[lv]);
  L.push('');
  L.push('—— 本册所记为情志走向与体质倾向，不构成诊断。');
  L.push('调理须由执业医师面诊，四诊合参后开方。');
  return L.join('\n');
}
function bindResult(){
  var p = document.getElementById('rPrint'), c = document.getElementById('rCopy'), g = document.getElementById('rAgain');
  if(p) p.onclick = function(){ window.print(); };
  if(c) c.onclick = function(){
    var t = window.__REPORT_TEXT__ || '';
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); alert('已复制文字版，可粘贴到微信或备忘录。'); }
    catch(e){ alert('复制失败，请长按选择文本。'); }
    document.body.removeChild(ta);
  };
  if(g) g.onclick = function(){
    if(!confirm('重走一遍？此册会清空。')) return;
    location.reload();
  };
  if(riskLevel()>=3) setTimeout(function(){ veilOpen('care'); }, 500);
}

        '你若已到了那一步，先别看册子——<em>先去找一个活人</em>。<span class="cl">' +

  else {
    p.innerHTML =
      '<div class="vg">太 虚 幻 境</div>' +
      '<div class="vt">使 用 须 知</div>' +
      '<div class="vb">这是一册<em>情志自察</em>的记录，不是诊断书。<br>' +
        '中医讲望闻问切，这里只有你自己的话。<br><br>' +
        '它只能提醒你<em>该去看哪一处</em>。' +
        '真要调理，须由执业医师面诊后开方。<br><br>' +

      '<div class="vbtn"><button class="btn" onclick="veilClose(0)">入 梦</button></div>';
  }
  v.className = 'veil on';

function veilClose(go){
  var v = document.getElementById('veil');
  if(v) v.className = 'veil';
  if(go){ stage='gate'; gateStep=0; render(); }
}

/* ==================================================================

(function(){
  buildFlow();

<script id="ce-override">
window.__IMG = {
  "ce": {"mu":"images/ce_mu.jpg","huo":"images/ce_huo.jpg","tu":"images/ce_tu.jpg","jin":"images/ce_jin.jpg","shui":"images/ce_shui.jpg"},

window.motif=function(k,cl,opt){var s=(window.__IMG.ce&&window.__IMG.ce[k])||'';return '<img class="ce-img" alt="" loading="lazy" src="'+s+'">';};
window.figSVG=function(k){var s=(window.__IMG.g&&window.__IMG.g[k])||'';return '<img class="fig-img" alt="" loading="lazy" src="'+s+'">';};
(function(){
  var IMG = window.__IMG;
  var RX_KEYS = ['body','act','emotion','faith','mission'];
  function fill(){
    document.querySelectorAll('[data-ce-cover]').forEach(function(el){if(!el.querySelector('img'))el.innerHTML='<img alt="" src="'+IMG.cover+'">';});
    document.querySelectorAll('[data-ce-out]').forEach(function(el){if(!el.querySelector('img'))el.innerHTML='<img alt="" loading="lazy" src="'+IMG.out+'">';});
  }
  function decorate(){
    var host=document.getElementById('app'); if(!host) return;
    if(typeof stage==='undefined') return;
    if(stage==='gate' && gateStep===1){
      var g=host.querySelector('.gate');
      if(g && !g.parentNode.querySelector('.gate2-img')){g.insertAdjacentHTML('afterend','<img class="gate2-img" alt="" loading="lazy" src="'+IMG.gate2+'">');}
    }
    else if(stage==='quiz' && typeof FLOW!=='undefined' && FLOW[fi]){
      var f=FLOW[fi];
      if(f.kind==='si'){
        var head=host.querySelector('.si-head');
        if(head && !head.parentNode.querySelector('.si-img') && IMG.si[f.si]){head.insertAdjacentHTML('afterend','<img class="si-img" alt="" loading="lazy" src="'+IMG.si[f.si]+'">');}
      }
      else if(f.kind==='q'){
        var qb=host.querySelector('.q-box');
        if(qb && !qb.querySelector('.q-banner') && IMG.si[f.q.si]){qb.insertAdjacentHTML('afterbegin','<img class="q-banner" alt="" loading="lazy" src="'+IMG.si[f.q.si]+'">');}
      }
    }
    else if(stage==='result'){
      var juans=host.querySelectorAll('.juan');
      if(juans.length && IMG.xing){
        var first=juans[0];
        if(!first.querySelector('.xing-img')){
          var jh=first.querySelector('.jh');
          if(jh) jh.insertAdjacentHTML('afterend','<img class="xing-img" alt="" loading="lazy" src="'+IMG.xing+'">');
        }
      }
      host.querySelectorAll('.rx5').forEach(function(r,i){
        if(!r.querySelector('.rx-img') && IMG.rx[RX_KEYS[i]]){r.insertAdjacentHTML('afterbegin','<img class="rx-img" alt="" loading="lazy" src="'+IMG.rx[RX_KEYS[i]]+'">');}
      });
      host.querySelectorAll('.sec-h').forEach(function(h){
        if(h.textContent.indexOf('气 机 定 级')>=0 && IMG.qiji){
          if(!h.parentNode.querySelector('.qiji-img')){h.insertAdjacentHTML('afterend','<img class="qiji-img" alt="" loading="lazy" src="'+IMG.qiji+'">');}
        }
      });
    }
  }
  function boot(){
    fill(); decorate();
    var host=document.getElementById('app')||document.body;
    new MutationObserver(function(){fill(); decorate();}).observe(host,{childList:true,subtree:true});
  }
  if(document.readyState!=='loading') boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
